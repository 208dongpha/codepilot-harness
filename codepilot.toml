[llm]
provider = "gemini"
model = "gemini-3.8-flash"
temperature = 0.2

[agent]
max_steps = 20
max_verification_retries = 3

[permissions]
mode = "ask_before_write"

[sandbox]
enabled = true
engine = "docker"
network_enabled = false
timeout_seconds = 60

[logging]
level = "INFO"

[repository]
workspace = "."
max_file_bytes = 131072
max_files = 1000
max_output_chars = 32000
max_map_chars = 16000
max_context_chars = 32000
timeout_seconds = 5
