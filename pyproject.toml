[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codepilot-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2,<3", "google-genai>=1", "python-dotenv>=1"]

[project.scripts]
codepilot = "codepilot.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ['src/codepilot']
